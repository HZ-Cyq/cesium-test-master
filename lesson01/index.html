    /**
     * DIS Euler (psi, theta, phi) -> 本地 Heading / Pitch / Roll (度数, 0/0/0 表示水平朝北)
     *
     * @param {number} psi    DIS yaw   (rad)
     * @param {number} theta  DIS pitch (rad)
     * @param {number} phi    DIS roll  (rad)
     * @param {number} lonDeg 经度 (度)
     * @param {number} latDeg 纬度 (度)
     * @param {number} height 高度 (米)
     * @returns {object} { heading, pitch, roll } 单位: 度, 归一化后
     */
    function disEulerToHPRNorthAligned(psi, theta, phi, lonDeg, latDeg, height = 0) {
      // 1. 经纬度转弧度
      const lon = Cesium.Math.toRadians(lonDeg);
      const lat = Cesium.Math.toRadians(latDeg);

      // 2. DIS Euler -> ECEF rotation matrix (Z-Y-X)
      const Rz = Cesium.Matrix3.fromRotationZ(psi);
      const Ry = Cesium.Matrix3.fromRotationY(theta);
      const Rx = Cesium.Matrix3.fromRotationX(phi);

      const Rzy = Cesium.Matrix3.multiply(Rz, Ry, new Cesium.Matrix3());
      const Recef = Cesium.Matrix3.multiply(Rzy, Rx, new Cesium.Matrix3());

      // 3. 构建本地 ENU 坐标系在 ECEF 下的变换矩阵，使用高度
      const enuFrame = Cesium.Transforms.eastNorthUpToFixedFrame(
        Cesium.Cartesian3.fromRadians(lon, lat, height)
      );

      // 4. 计算 ECEF -> ENU 的旋转矩阵
      const invEnu = Cesium.Matrix4.inverseTransformation(enuFrame, new Cesium.Matrix4());
      const ecefToEnuRot = Cesium.Matrix4.getRotation(invEnu, new Cesium.Matrix3());

      // 5. Renu = ENU 下的实体旋转矩阵
      const Renu = Cesium.Matrix3.multiply(ecefToEnuRot, Recef, new Cesium.Matrix3());

      // 6. 矩阵 -> 四元数
      const quat = Cesium.Quaternion.fromRotationMatrix(Renu);

      // 7. 四元数 -> HPR
      let hpr = Cesium.HeadingPitchRoll.fromQuaternion(quat);

      // 8. 对齐模型前向到北方向（北朝向 = heading 0）
      hpr.heading += Math.PI / 2; // 补偿90°
      hpr.heading = (hpr.heading + 2 * Math.PI) % (2 * Math.PI);

      // 9. pitch 保持原值
      let pitch = hpr.pitch;

      // 10. roll 归一化 [-π, π]
      let roll = hpr.roll;
      if (roll > Math.PI) roll -= 2 * Math.PI;
      if (roll < -Math.PI) roll += 2 * Math.PI;

      return {
        heading: Cesium.Math.toDegrees(hpr.heading),
        pitch: Cesium.Math.toDegrees(pitch),
        roll: Cesium.Math.toDegrees(roll)
      };
    }
/**
 * DIS Euler (psi, theta, phi)
 * → 本地 ENU Heading / Pitch / Roll
 *
 * Heading 定义：
 *   0° = 北
 *   顺时针为正
 *   [0, 360)
 */
 function disEulerToHPRNorthAligned2(
  psi,
  theta,
  phi,
  lonDeg,
  latDeg,
  height = 0
) {
  /* ---------- 1. DIS Euler → ECEF ---------- */
  const Rz = Cesium.Matrix3.fromRotationZ(psi);
  const Ry = Cesium.Matrix3.fromRotationY(theta);
  const Rx = Cesium.Matrix3.fromRotationX(phi);

  const R_ecef_body = Cesium.Matrix3.multiply(
    Rz,
    Cesium.Matrix3.multiply(Ry, Rx, new Cesium.Matrix3()),
    new Cesium.Matrix3()
  );

  /* ---------- 2. ECEF → ENU ---------- */
  const origin = Cesium.Cartesian3.fromDegrees(lonDeg, latDeg, height);
  const enuToEcef = Cesium.Transforms.eastNorthUpToFixedFrame(origin);

  const R_enu_ecef = Cesium.Matrix3.transpose(
    Cesium.Matrix4.getRotation(enuToEcef, new Cesium.Matrix3()),
    new Cesium.Matrix3()
  );

  const R_enu_body = Cesium.Matrix3.multiply(
    R_enu_ecef,
    R_ecef_body,
    new Cesium.Matrix3()
  );

  /* ---------- 3. DIS → Cesium 机体系修正 ---------- */
  const bodyFix = new Cesium.Matrix3(
     1,  0,  0,
     0, -1,  0,
     0,  0, -1
  );

  const R = Cesium.Matrix3.multiply(
    R_enu_body,
    bodyFix,
    new Cesium.Matrix3()
  );

  /* ---------- 4. Heading：用前向向量直接算 ---------- */
  // Cesium 机体前向 = +X
  const forwardENU = Cesium.Matrix3.multiplyByVector(
    R,
    Cesium.Cartesian3.UNIT_X,
    new Cesium.Cartesian3()
  );

  // 投影到 EN 平面
  const east  = forwardENU.x;
  const north = forwardENU.y;

  // 0° = 北，顺时针为正
  let headingRad = Math.atan2(east, north);
  let headingDeg = Cesium.Math.toDegrees(headingRad);
  headingDeg = (headingDeg % 360 + 360) % 360;

  /* ---------- 5. Pitch / Roll（仍用 Cesium） ---------- */
  const q = Cesium.Quaternion.fromRotationMatrix(R);
  const hpr = Cesium.HeadingPitchRoll.fromQuaternion(q);

  let pitchDeg = Cesium.Math.toDegrees(hpr.pitch);
  let rollDeg  = Cesium.Math.toDegrees(hpr.roll);

  // 消除 ±180° 假象
  if (Math.abs(Math.abs(rollDeg) - 180) < 1e-6) {
    rollDeg = 0;
  }

  return {
    heading: headingDeg,
    pitch: pitchDeg,
    roll: rollDeg
  };
}

    function addLine2() {
      // 创建一个 PrimitiveCollection
      const primitiveCollection = new Cesium.PrimitiveCollection();
      // 定义线的顶点
      const positions = Cesium.Cartesian3.fromDegreesArray([
        0, 39.57,
        89, 38.53
      ]);
      // 创建几何实例
      const lineGeometry = new Cesium.GeometryInstance({
        geometry: new Cesium.SimplePolylineGeometry({
          positions: positions,
          width: 5 // 线宽度
        })
      });
      // 创建材质外观
      const lineAppearance = new Cesium.PolylineMaterialAppearance({
        material: Cesium.Material.fromType('Color', {
          color: Cesium.Color.RED
        })
      });
      // 创建线条 Primitive
      const linePrimitive = new Cesium.Primitive({
        geometryInstances: lineGeometry,
        appearance: lineAppearance
      });
      viewer.scene.primitives.add(primitiveCollection);
      // 将线条 Primitive 添加到 PrimitiveCollection 中
      primitiveCollection.add(linePrimitive);
      // 将 PrimitiveCollection 添加到场景的 primitives 中
    }
